<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Memory Game</h1>
    <div class="game-info">
      <input type="text" id="cardsRevealed" value="Cards Revealed: 0" />
      <input type="text" id="timer" value="Time: 00:00" />
      <button type="button" id="restartGameBtn">Restart</button>
    </div>

    <div class="grid-control">
      <button class="grid-btn" id="grid-less" type="button">←</button>
      <div class="grid-display" id="grid-display">Grid Size: 16</div>
      <button class="grid-btn" id="grid-more" type="button">→</button>
    </div>

    <div class="grid"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti/dist/confetti.browser.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
